tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Partially update a contact by its unique identifier'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    description: 'The ID of the contact to update'
    required: true
    schema:
      type: string
      example: '6727a753d4aae8a1423f4213'
responses:
  '200':
    description: 'The fields to update in the contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
