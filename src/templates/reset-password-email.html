<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #010108;
    }

    .content {
      margin-top: 20px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      color: #ffffff;
      background-color: #f7f8f8;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 20px;
    }

    .footer {
      font-size: 0.9em;
      color: #777;
      margin-top: 30px;
      text-align: center;
    }

    .footer p {
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello, {{name}}!</h1>
    <p class="content">
      We received a request to reset your password. Click the button below to proceed. If you did not request this
      change, you can safely ignore this email.
    </p>
    <a href="{{link}}" class="btn">Reset Password</a>
    <div class="footer">
      <p>If the button above doesn't work, copy and paste this link into your browser:</p>
      <p><a href="{{link}}">{{link}}</a></p>
      <p>Thank you!</p>
    </div>
  </div>
</body>

</html>
